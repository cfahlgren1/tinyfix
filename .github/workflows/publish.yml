# Publishes to npm when a GitHub release is published. npm trusts this workflow directly (trusted publishing), so
# there's no token to store, and the package gets a provenance statement linking it to the commit it was built from.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      # prepublishOnly type-checks, lints, tests and builds before anything is uploaded.
      - run: npm publish
